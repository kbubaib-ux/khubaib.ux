<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>خشتەی وانەکان — ئامادەیی ئەحمەد موختار</title>
<meta name="theme-color" content="#1F4E79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="خشتەی وانەکان">
<link rel="apple-touch-icon" id="touchicon">
<link rel="icon" id="favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202B; --muted:#5C6B7A; --line:#DCE3EA;
  --paper:#FFFFFF; --wash:#F3F6F9; --brand:#1F4E79; --brand-soft:#DEEAF6;
  --bell:#C08A22; --bell-soft:#FBF1DC; --alert:#9C0006; --alert-soft:#FFD9DC;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E9EFF5; --muted:#9BABBB; --line:#2A3846;
    --paper:#111A23; --wash:#18242F; --brand:#8CBBE4; --brand-soft:#1B2E42;
    --bell:#E0B357; --bell-soft:#2A2213; --alert:#FF9AA2; --alert-soft:#3A1D20;
  }
}
:root[data-theme="dark"]{
  --ink:#E9EFF5; --muted:#9BABBB; --line:#2A3846;
  --paper:#111A23; --wash:#18242F; --brand:#8CBBE4; --brand-soft:#1B2E42;
  --bell:#E0B357; --bell-soft:#2A2213; --alert:#FF9AA2; --alert-soft:#3A1D20;
}
body{
  margin:0;background:var(--wash);color:var(--ink);
  font-family:"Noto Naskh Arabic",serif;font-size:16px;line-height:1.7;
}
h1,h2,h3,.ui{font-family:"Noto Kufi Arabic",sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:0 14px 48px}

header.top{
  position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
  padding-top:env(safe-area-inset-top,0px);
  box-shadow:0 1px 0 rgba(0,0,0,.12);
}
:root[data-theme="dark"] header.top, html header.top{}
.top .bar{max-width:760px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.top h1{margin:0;font-size:17px;font-weight:600;color:#fff;flex:1}
.top .sub{font-size:12px;opacity:.85;font-family:"Noto Kufi Arabic",sans-serif}
.back{
  appearance:none;border:0;background:rgba(255,255,255,.16);color:#fff;
  font-family:inherit;font-size:15px;padding:6px 12px;border-radius:9px;cursor:pointer;
}
.back.home{background:rgba(255,255,255,.10)}
.back:focus-visible,button:focus-visible{outline:2px solid var(--bell);outline-offset:2px}

.hero{position:relative;margin:14px 0 4px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--brand)}
.hero img{display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:cover}
.hero .cap{position:absolute;inset:auto 0 0 0;padding:26px 14px 12px;color:#fff;
  background:linear-gradient(to top, rgba(10,22,34,.86), rgba(10,22,34,.45) 55%, rgba(10,22,34,0));
  font-family:"Noto Kufi Arabic",sans-serif}
.hero .cap b{display:block;font-size:16px;font-weight:600;line-height:1.4}
.hero .cap span{font-size:12px;opacity:.9}
.now{
  margin:14px 0;padding:12px 14px;border-radius:12px;
  background:var(--bell-soft);border:1px solid var(--bell);
}
.now .k{font-family:"Noto Kufi Arabic",sans-serif;font-size:12px;color:var(--muted)}
.now .v{font-family:"Noto Kufi Arabic",sans-serif;font-size:18px;font-weight:600}
.now .t{font-size:14px;color:var(--muted)}

.menu{display:grid;gap:8px;margin:14px 0}
.menu .head{font-family:"Noto Kufi Arabic",sans-serif;font-size:13px;color:var(--muted);margin:14px 2px 2px}
.btn{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;
  background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:14px;font-family:"Noto Kufi Arabic",sans-serif;font-size:16px;color:var(--ink);
  cursor:pointer;text-align:right;
}
.btn:active{background:var(--brand-soft)}
.btn .hint{font-size:13px;color:var(--muted);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.chip{
  background:var(--paper);border:1px solid var(--line);border-radius:999px;
  padding:9px 16px;font-family:"Noto Kufi Arabic",sans-serif;font-size:16px;color:var(--ink);cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:#fff}

.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin:12px 0}
.row{display:grid;grid-template-columns:52px 1fr;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{
  background:var(--wash);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-family:"Noto Kufi Arabic",sans-serif;padding:8px 4px;
}
.row .n b{font-size:17px;font-weight:600}
.row .n span{font-size:10px;color:var(--muted);direction:ltr}
.row .m{padding:9px 12px}
.row .s{font-family:"Noto Kufi Arabic",sans-serif;font-size:16px;font-weight:600}
.row .who{font-size:14px;color:var(--muted)}
.row.free .s{color:var(--muted);font-weight:400}
.row.live{background:var(--bell-soft)}
.row.live .n{background:var(--bell);color:#fff}
.row.live .n span{color:rgba(255,255,255,.85)}

.scroll{overflow:auto;-webkit-overflow-scrolling:touch;background:var(--paper);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;font-size:12px;min-width:100%}
th,td{border:1px solid var(--line);padding:4px 5px;text-align:center;white-space:nowrap}
thead th{position:sticky;top:0;background:var(--brand);color:#fff;font-family:"Noto Kufi Arabic",sans-serif;font-size:12px;z-index:3}
tbody th{position:sticky;right:0;background:var(--brand);color:#fff;font-family:"Noto Kufi Arabic",sans-serif;z-index:2}
td .s{font-family:"Noto Kufi Arabic",sans-serif;display:block}
td .w{color:var(--muted);display:block;font-size:11px}
td.hit{background:var(--bell-soft)}
td.hit .w{color:var(--ink)}
tr.band td{background:var(--wash)}
tr.band td.hit{background:var(--bell-soft)}
.clash{background:var(--alert-soft) !important;color:var(--alert) !important;font-weight:700}

.search{
  width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);color:var(--ink);font-family:"Noto Kufi Arabic",sans-serif;font-size:16px;margin:12px 0;
}
.list{display:grid;gap:6px}
.tname{display:flex;justify-content:space-between;align-items:center;gap:8px}
.star{background:none;border:0;font-size:20px;cursor:pointer;color:var(--muted);padding:4px 6px}
.star[aria-pressed="true"]{color:var(--bell)}
.note{font-size:13px;color:var(--muted);margin:16px 2px;line-height:1.8}
.daybar{display:flex;gap:6px;overflow:auto;margin:12px 0;padding-bottom:2px}
.daybar .chip{flex:0 0 auto;font-size:15px;padding:8px 14px}
.empty{padding:14px;color:var(--muted);font-family:"Noto Kufi Arabic",sans-serif}
.howto{position:fixed;inset:0;background:rgba(10,18,26,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.howto .sheet{background:var(--paper);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.howto h3{margin:0 0 8px;font-size:17px}
.howto ol{margin:0;padding-inline-start:20px;line-height:2}
.howto .close{margin-top:14px;width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:12px;font-family:"Noto Kufi Arabic",sans-serif;font-size:16px;cursor:pointer}
.install{background:var(--bell-soft);border-color:var(--bell)}
.btn.foot{margin-top:18px;background:var(--wash)}
.howto .sheet a{color:var(--brand);font-weight:600}
.dev input{width:100%;margin:8px 0 2px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--wash);color:var(--ink);font-size:14px;direction:ltr;text-align:left}
.dev .lnk{display:block;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0;text-decoration:none;color:var(--ink);font-family:"Noto Kufi Arabic",sans-serif}
.dev .small{font-size:12px;color:var(--muted)}
.btn.foot .hint{padding:4px 10px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}
.sum{font-family:"Noto Kufi Arabic",sans-serif;font-size:13px;color:var(--muted);margin:2px 2px 10px}
@media (prefers-reduced-motion:no-preference){.card,.btn{transition:background .12s ease}}
</style>
</head>
<body>
<header class="top">
  <div class="bar">
    <button class="back" id="back" hidden>← پاشەوە</button>
    <button class="back home" id="homebtn" hidden>سەرەتا</button>
    <h1 id="title">خشتەی وانەکان</h1>
    <div class="sub" id="sub">٢٠٢٦ – ٢٠٢٧</div>
  </div>
</header>
<main class="wrap" id="view"></main>

function parseCSV(text){
  const rows=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if(ch==='"') q=true;
    else if(ch===","){ row.push(cell); cell=""; }
    else if(ch==="\n"){ row.push(cell); rows.push(row); row=[]; cell=""; }
    else if(ch!=="\r") cell+=ch;
  }
  if(cell.length||row.length){ row.push(cell); rows.push(row); }
  return rows;
}

    if (t === "ن" || !t) return;
    const by = {};
    list.forEach(x => { const k = x.d + "-" + x.p; (by[k] = by[k] || []).push(x); });
    Object.values(by).forEach(g => { if (g.length > 1) g.forEach(x => CLASH.add(t + "|" + x.d + "|" + x.p + "|" + x.cls)); });
  });
}
reindex();

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem(k); } catch (e) {} }
};

function nowInfo() {
  const n = new Date();
  const js = n.getDay();            // 0 Sun .. 6 Sat
  const d = (js >= 0 && js <= 4) ? js : -1;   // Sun..Thu -> 0..4
  if (d < 0) return { d: -1 };
  const mins = n.getHours() * 60 + n.getMinutes();
  const toM = s => +s.slice(0, 2) * 60 + +s.slice(3);
  for (let p = 0; p < 6; p++) {
    const [a, b] = DATA.times[p];
    if (mins >= toM(a) && mins < toM(b)) return { d, p, state: "in" };
    if (mins < toM(a)) return { d, p, state: "before" };
  }
  return { d, p: -1, state: "after" };
}

const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const view = document.getElementById("view");
const titleEl = document.getElementById("title");
const subEl = document.getElementById("sub");
const backEl = document.getElementById("back");
const homeEl = document.getElementById("homebtn");
let stack = [];

function go(state, push = true) {
  if (push) { stack.push(state); try { history.pushState({ i: stack.length }, ""); } catch (e) {} }
  render(state);
  window.scrollTo(0, 0);
}
function goBack() {
  if (stack.length <= 1) return;
  try { history.back(); } catch (e) { stepBack(); }
}
function stepBack() {
  if (stack.length <= 1) return;
  stack.pop();
  render(stack[stack.length - 1]);
  window.scrollTo(0, 0);
}
function goHome() {
  if (stack.length <= 1) return;
  const jumps = stack.length - 1;
  stack = [{ v: "home" }];
  try { history.go(-jumps); } catch (e) { render(stack[0]); }
  render(stack[0]);
  window.scrollTo(0, 0);
}
window.addEventListener("popstate", () => {
  if (stack.length > 1) { stack.pop(); render(stack[stack.length - 1]); window.scrollTo(0, 0); }
  else render(stack[0]);
});
backEl.addEventListener("click", goBack);

// hidden developer panel — five taps on the title
let taps = 0, tapTimer = null;
titleEl.addEventListener("click", () => {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { taps = 0; }, 2500);
  if (taps >= 5) { taps = 0; devPanel(); }
});

function devPanel() {
  const saved = store.get("devlink") || "";
  const box = el(`<div class="howto"><div class="sheet dev">
    <h3>پەرەپێدان</h3>
    <a class="lnk" href="${SHEET_EDIT}" target="_blank" rel="noopener">گووگڵ شیت — دەستکاریکردنی خشتە</a>
    <div class="small">لینکی چاتەکەی کلاود — تەنها لەم مۆبایلەدا هەڵدەگیرێت</div>
    <input id="devin" placeholder="https://claude.ai/chat/..." value="${saved}">
    <a class="lnk" id="devopen" href="${saved || "https://claude.ai/"}" target="_blank" rel="noopener">کردنەوەی کلاود</a>
    <button class="close" id="devsave">پاشەکەوتی بکە</button>
    <button class="close" id="devclear" style="background:var(--wash);color:var(--ink);margin-top:8px">سڕینەوەی کاش و نوێکردنەوە</button>
    <button class="close" style="background:var(--wash);color:var(--ink);margin-top:8px">داخستن</button>
  </div></div>`);
  box.addEventListener("click", e => {
    if (e.target === box) box.remove();
    if (e.target.id === "devsave") {
      const v = box.querySelector("#devin").value.trim();
      if (v) store.set("devlink", v); else store.del("devlink");
      box.querySelector("#devopen").href = v || "https://claude.ai/";
      e.target.textContent = "پاشەکەوت کرا";
      return;
    }
    if (e.target.id === "devclear") {
      store.del("sheet");
      if ("caches" in window) caches.keys().then(ks => ks.forEach(k => caches.delete(k)));
      if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister()));
      setTimeout(() => location.reload(), 400);
      return;
    }
    if (e.target.classList.contains("close")) box.remove();
  });
  document.body.append(box);
}
homeEl.addEventListener("click", goHome);

function render(st) {
  backEl.hidden = stack.length <= 1;
  homeEl.hidden = stack.length <= 1;
  view.innerHTML = "";
  if (st.v === "home") return home();
  if (st.v === "all") return allGrid();
  if (st.v === "level") return level(st.level);
  if (st.v === "class") return classView(st.cls);
  if (st.v === "teachers") return teacherList();
  if (st.v === "teacher") return teacherView(st.t);
}

function setHead(t, s) { titleEl.textContent = t; subEl.textContent = s || "٢٠٢٦ – ٢٠٢٧"; }

function footBack() {
  if (stack.length <= 1) return;
  const b = el('<button class="btn foot"><span>← گەڕانەوە</span><span class="hint">سەرەتا</span></button>');
  b.onclick = goBack;
  b.querySelector(".hint").onclick = (e) => { e.stopPropagation(); goHome(); };
  view.append(b);
}

function nowCard() {
  const i = nowInfo();
  let k = "ئێستا", v, t = "";
  if (i.d < 0) { v = "ڕۆژی پشوو"; t = "دەوام ڕۆژانی یەکشەممە تا پێنجشەممەیە"; }
  else if (i.state === "in") { k = "ئێستا لە دەرسدایە"; v = "دەرسی " + ORD[i.p]; t = DATA.times[i.p][0] + " – " + DATA.times[i.p][1]; }
  else if (i.state === "before") { k = "دەرسی داهاتوو"; v = "دەرسی " + ORD[i.p]; t = "لە " + DATA.times[i.p][0] + "ەوە دەست پێ دەکات"; }
  else { v = "دەوام کۆتایی هات"; t = "بەیانی لە " + DATA.times[0][0] + " دەست پێ دەکات"; }
  const day = i.d >= 0 ? DATA.days[i.d] : "";
  return el(`<section class="now"><div class="k">${k}${day ? " — " + day : ""}</div><div class="v">${v}</div><div class="t">${t}</div></section>`);
}

function home() {
  setHead("ئامادەیی ئەحمەد موختار");
  view.append(el(`<figure class="hero"><img src="${HERO}" alt="ئامادەیی ئەحمەد موختار جاف">
    <figcaption class="cap"><b>ئامادەیی ئەحمەد موختار جاف</b><span>خشتەی وانەکان — هەڵەبجە</span></figcaption></figure>`));
  view.append(nowCard());
  const fav = store.get("fav");
  const m = el('<nav class="menu"></nav>');
  if (fav && TEACH[fav]) {
    m.append(el(`<div class="head">خشتەی من</div>`));
    const b = el(`<button class="btn"><span>${fav}</span><span class="hint">${DIG(TEACH[fav].length)} وانە</span></button>`);
    b.onclick = () => go({ v: "teacher", t: fav });
    m.append(b);
  }
  m.append(el('<div class="head">خشتەکان</div>'));
  const a = el('<button class="btn"><span>خشتەی گشتی</span><span class="hint">هەموو پۆلەکان</span></button>');
  a.onclick = () => go({ v: "all" });
  m.append(a);
  const t = el(`<button class="btn"><span>مامۆستایان</span><span class="hint">${DIG(TNAMES.length)} مامۆستا</span></button>`);
  t.onclick = () => go({ v: "teachers" });
  m.append(t);
  m.append(el('<div class="head">ئاستەکان</div>'));
  DATA.levels.forEach(l => {
    const n = DATA.classes.filter(c => c.level === l).length;
    const b = el(`<button class="btn"><span>${l}</span><span class="hint">${DIG(n)} پۆل</span></button>`);
    b.onclick = () => go({ v: "level", level: l });
    m.append(b);
  });
  view.append(m);
  if (!standalone()) {
    const ins = el('<button class="btn install"><span>زیادی کە بۆ شاشە</span><span class="hint">ئایکۆنی ئەپەکە لەسەر مۆبایلەکەت</span></button>');
    ins.onclick = addToHome;
    view.append(ins);
  }
  const sync = el(`<button class="btn"><span id="syncline">${syncText()}</span><span class="hint">نوێی بکەرەوە</span></button>`);
  sync.onclick = () => refresh(false);
  view.append(sync);
  view.append(el(`<p class="note">«ن» واتە ناوی مامۆستاکە هێشتا نەزانراوە.<br>کاتی وانەکان: ${DIG("08:00")} تا ${DIG("12:35")}. لە نێوان دەرسی پێنجەم و شەشەمدا پشوو نییە.<br>ئەم خشتەیە وەشانی تاقیکردنەوەیە. هەر گۆڕانکارییەک لە خشتەی فەرمیدا بێت، لێرەش نوێ دەکرێتەوە.</p>`));
}

function allGrid() {
  setHead("خشتەی گشتی", "دوو پەنجە بۆ گەورەکردن");
  const bar = el('<div class="daybar"></div>');
  const box = el('<div class="scroll"></div>');
  let day = Math.max(0, nowInfo().d);
  DATA.days.forEach((d, i) => {
    const c = el(`<button class="chip" aria-pressed="${i === day}">${d}</button>`);
    c.onclick = () => { day = i; [...bar.children].forEach((x, j) => x.setAttribute("aria-pressed", j === i)); draw(); };
    bar.append(c);
  });
  function draw() {
    const n = nowInfo();
    let h = '<table><thead><tr><th>دەرس</th>';
    DATA.classes.forEach(c => h += `<th>${c.level.replace("زانستی", "ز").replace("ویژەیی", "و")} ${c.sec}</th>`);
    h += "</tr></thead><tbody>";
    for (let p = 0; p < 6; p++) {
      const live = (n.d === day && n.state === "in" && n.p === p);
      h += `<tr class="${p % 2 ? "band" : ""}"><th>${DIG(p + 1)}<br><span style="font-size:10px;direction:ltr">${DATA.times[p][0]}</span></th>`;
      DATA.classes.forEach(c => {
        const x = DATA.grid[c.id][day][p];
        const bad = x.t && CLASH.has(x.t + "|" + day + "|" + p + "|" + c.id);
        h += `<td class="${bad ? "clash" : ""}${live ? " hit" : ""}"><span class="s">${x.s || "—"}</span><span class="w">${x.t || ""}</span></td>`;
      });
      h += "</tr>";
    }
    box.innerHTML = h + "</tbody></table>";
  }
  draw();
  view.append(bar, box);
  view.append(el('<p class="note">خانە سوورەکان تەزاربن: هەمان مامۆستا لە یەک کاتدا لە دوو پۆلدایە.</p>'));
  footBack();
}

function level(l) {
  setHead(l, "پۆلێک هەڵبژێرە");
  const ch = el('<div class="chips"></div>');
  DATA.classes.filter(c => c.level === l).forEach(c => {
    const b = el(`<button class="chip">${c.sec}</button>`);
    b.onclick = () => go({ v: "class", cls: c.id });
    ch.append(b);
  });
  view.append(ch);
  footBack();
}

function dayTabs(initial, onPick) {
  const bar = el('<div class="daybar"></div>');
  DATA.days.forEach((d, i) => {
    const c = el(`<button class="chip" aria-pressed="${i === initial}">${d}</button>`);
    c.onclick = () => { [...bar.children].forEach((x, j) => x.setAttribute("aria-pressed", j === i)); onPick(i); };
    bar.append(c);
  });
  return bar;
}

function lessonRow(p, s, who, live, bad) {
  return el(`<div class="row ${live ? "live" : ""} ${s ? "" : "free"}">
    <div class="n"><b>${DIG(p + 1)}</b><span>${DATA.times[p][0]}</span></div>
    <div class="m"><div class="s">${s || "بەتاڵ"}</div><div class="who ${bad ? "clash" : ""}">${who || ""}</div></div>
  </div>`);
}

function classView(cid) {
  setHead(cid);
  let day = Math.max(0, nowInfo().d);
  const card = el('<section class="card"></section>');
  function draw() {
    const n = nowInfo();
    card.innerHTML = "";
    DATA.grid[cid][day].forEach((x, p) => {
      const bad = x.t && CLASH.has(x.t + "|" + day + "|" + p + "|" + cid);
      card.append(lessonRow(p, x.s, x.t, n.d === day && n.state === "in" && n.p === p, bad));
    });
  }
  draw();
  view.append(dayTabs(day, i => { day = i; draw(); }), card);
  footBack();
}

function teacherList() {
  setHead("مامۆستایان", DIG(TNAMES.length) + " مامۆستا");
  const s = el('<input class="search" placeholder="ناوەکەت بنووسە" inputmode="search">');
  const list = el('<div class="list"></div>');
  const fav = store.get("fav");
  function draw(q) {
    list.innerHTML = "";
    TNAMES.filter(t => !q || t.includes(q)).forEach(t => {
      const b = el(`<div class="btn tname"><span>${t}</span></div>`);
      const go_ = el(`<span class="hint">${DIG(TEACH[t].length)} وانە</span>`);
      const star = el(`<button class="star" aria-pressed="${fav === t}" title="خشتەی من">★</button>`);
      star.onclick = (e) => {
        e.stopPropagation();
        const cur = store.get("fav");
        if (cur === t) { store.del("fav"); star.setAttribute("aria-pressed", "false"); }
        else { store.set("fav", t); [...list.querySelectorAll(".star")].forEach(x => x.setAttribute("aria-pressed", "false")); star.setAttribute("aria-pressed", "true"); }
      };
      b.append(go_, star);
      b.onclick = () => go({ v: "teacher", t });
      list.append(b);
    });
    if (!list.children.length) list.append(el('<div class="empty">ئەم ناوە لە خشتەدا نییە.</div>'));
  }
  draw("");
  s.addEventListener("input", () => draw(s.value.trim()));
  view.append(s, list);
  footBack();
}

function teacherView(t) {
  const lessons = TEACH[t] || [];
  const daysOn = new Set(lessons.map(x => x.d));
  setHead(t, DIG(lessons.length) + " وانە لە " + DIG(daysOn.size) + " ڕۆژدا");
  const fav = store.get("fav");
  const star = el(`<button class="btn"><span>${fav === t ? "لە «خشتەی من» لای بدە" : "بیکە بە «خشتەی من»"}</span><span class="hint">★</span></button>`);
  star.onclick = () => { if (store.get("fav") === t) store.del("fav"); else store.set("fav", t); render({ v: "teacher", t }); };
  view.append(star);
  const n = nowInfo();
  DATA.days.forEach((dname, d) => {
    const mine = lessons.filter(x => x.d === d);
    view.append(el(`<div class="sum">${dname}${mine.length ? " — " + DIG(mine.length) + " وانە" : ""}</div>`));
    const card = el('<section class="card"></section>');
    if (!mine.length) card.append(el('<div class="empty">ئەم ڕۆژە وانەت نییە.</div>'));
    else {
      mine.sort((a, b) => a.p - b.p).forEach(x => {
        const bad = CLASH.has(t + "|" + x.d + "|" + x.p + "|" + x.cls);
        card.append(lessonRow(x.p, x.s + " — " + x.cls, bad ? "تەزارب: لە هەمان کاتدا لە پۆلێکی تریشدایت" : "", n.d === d && n.state === "in" && n.p === x.p, bad));
      });
    }
    view.append(card);
  });
  footBack();
}

let deferredPrompt = null;
const standalone = () =>
  (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); deferredPrompt = e;
  if (stack.length === 1) render(stack[0]);
});
window.addEventListener("appinstalled", () => {
  deferredPrompt = null;
  if (stack.length === 1) render(stack[0]);
});
function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
function addToHome(){
  if (deferredPrompt) {
    const p = deferredPrompt; deferredPrompt = null;
    p.prompt(); p.userChoice.then(() => { if (stack.length === 1) render(stack[0]); });
    return;
  }
  const steps = isIOS()
    ? ["لە خوارەوەی سەفاری، دوگمەی هاوبەشکردن (چوارگۆشەیەک بە تیرێکی سەرەوە) دابگرە.",
       "بەرەو خوارەوە بگەڕێ بۆ «Add to Home Screen».",
       "«Add» لێ بدە."]
    : ["لە سەرەوەی وێبگەڕەکە، مێنیوی سێ خاڵ (⋮) بکەرەوە.",
       "«Add to Home screen» یان «Install app» هەڵبژێرە.",
       "دڵنیای بکەرەوە."];
  const box = el(`<div class="howto"><div class="sheet">
    <h3>زیادکردن بۆ شاشەی سەرەکی</h3>
    <ol>${steps.map(s => "<li>" + s + "</li>").join("")}</ol>
    <button class="close">تێگەیشتم</button></div></div>`);
  box.addEventListener("click", e => { if (e.target === box || e.target.classList.contains("close")) box.remove(); });
  document.body.append(box);
}

let SYNC = "";
function applyData(d, when){ DATA = d; reindex(); SYNC = when; render(stack[stack.length - 1]); }
function syncText(){
  if (!SYNC) return "خشتەی ناو ئەپەکە — پەیوەندی بە شیتەکەوە نەکرا";
  const d = new Date(SYNC), two = n => String(n).padStart(2, "0");
  return "دوایین نوێکردنەوە: " + DIG(two(d.getHours()) + ":" + two(d.getMinutes()));
}
function refresh(quiet){
  const box = document.getElementById("syncline");
  if (box && !quiet) box.textContent = "نوێ دەکرێتەوە…";
  fetch(CSV_URL + "&t=" + Date.now(), { cache: "no-store" })
    .then(r => { if (!r.ok) throw new Error("net"); return r.text(); })
    .then(txt => {
      const d = buildFromCSV(txt);
      const when = new Date().toISOString();
      store.set("sheet", JSON.stringify({ data: d, when }));
      applyData(d, when);
    })
    .catch(() => { const b = document.getElementById("syncline"); if (b) b.textContent = syncText(); });
}
(function boot(){
  const raw = store.get("sheet");
  if (raw) { try { const c = JSON.parse(raw); DATA = c.data; SYNC = c.when; reindex(); } catch (e) {} }
  stack = [{ v: "home" }];
  render(stack[0]);
  refresh(true);
})();
setInterval(() => { if (stack.length === 1) render(stack[0]); }, 60000);

if ("serviceWorker" in navigator && location.protocol === "https:") {
  window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
}
</script>
